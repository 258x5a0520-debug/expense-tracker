name: Build Release APK and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android scaffolding if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name pocket_expenses --platforms android .
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Widget Tests (GP 11)
        run: flutter test

      - name: Build Release APK (GP 10)
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-expenses-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
